<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <title>Login - Fender Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<section id="header">

    <a href="#">
        <img src="/Img/Fender_guitars_logo 1.svg" class="logo" alt="">
    </a>

    <ul id="navbar">

        <li><a href="index.html">HOME</a></li>

        <li class="dropdown">

            <a href="Product.html">PRODUCT</a>

            <ul class="submenu">
                <li><a href="ELECTRIC_GUITAR.html">Electric Guitar</a></li>
                <li><a href="BASS_GUITAR.html">Bass Guitar</a></li>
            </ul>

        </li>

        <li><a href="blog.html">BLOG</a></li>

        <li><a href="about.html">ABOUT US</a></li>

        <li>
            <a class="active" href="account.html">
                <i class="fa-regular fa-user"></i>
            </a>
        </li>

        <li>
            <a href="cart.html">
                <i class="fa-solid fa-bag-shopping"></i>
            </a>
        </li>

    </ul>

</section>

<!-- LOGIN -->
<section id="login-page">

    <div class="login-container">

        <!-- LEFT -->
        <div class="login-left">

            <h4>Welcome Back</h4>

            <h1>LOGIN</h1>

            <p>
                Sign in to discover iconic Fender guitars,
                exclusive collections and legendary sound.
            </p>

            <img src="Img/login-guitar.png" alt="">

        </div>

        <!-- RIGHT -->
        <div class="login-right">

            <form id="login-form">

    <h2>Sign In</h2>

    <div class="input-box">
        <i class="fa-regular fa-envelope"></i>
        <input type="email" placeholder="Email Address" required>
    </div>

    <div class="input-box">
        <i class="fa-solid fa-lock"></i>
        <input type="password" placeholder="Password" required>
    </div>

    <button type="submit">
        LOGIN
    </button>

</form>

        </div>

    </div>

</section>
<script>
    const form = document.getElementById("login-form");

    form.addEventListener("submit", function(e){

        e.preventDefault();

        alert("Đăng nhập thành công!");

        window.location.href = "Product.html";

    });
</script>
</body>
</html>
